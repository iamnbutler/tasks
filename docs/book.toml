[book]
title = "Tasks Specification"
authors = ["Tasks Team"]
description = "Specification for the Tasks platform - a human-in-the-loop system for orchestrating coding agents"
src = "../spec"
language = "en"

[build]
build-dir = "build"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/iamnbutler/tasks"
edit-url-template = "https://github.com/iamnbutler/tasks/edit/main/spec/{path}"
site-url = "/tasks/"
cname = ""
additional-css = []
additional-js = []
no-section-label = false

[output.html.print]
enable = true

[output.html.fold]
enable = false
level = 0

[output.html.playground]
editable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
