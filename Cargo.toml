[workspace]
resolver = "2"
# app-gpui is deliberately NOT a workspace member: it drags the gpui stack
# into every `cargo test --workspace` otherwise. It builds standalone (own
# Cargo.lock) and reaches the shared wire types via a path dep on
# crates/tasks-api.
exclude = ["app-gpui"]
members = [
    "crates/build-stamp",
    "crates/builder-supervisor",
    "crates/scout-supervisor",
    "crates/tasks",
    "crates/tasks-api",
    "crates/tasks-client",
    "crates/tasks-protocol",
    "crates/vm-pool/client",
    "crates/vm-pool/pool",
    "crates/vm-pool/protocol",
    "crates/vm-pool/service",
    "crates/vm-pool/supervisor",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/iamnbutler/tasks"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
    "macros",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
base64 = "0.22"
# Blocking HTTP for tasks-client: the API is loopback-only plain http, so no
# TLS and no async runtime — a GUI client calls from its own worker threads.
ureq = { version = "2", default-features = false, features = ["json"] }

dirs = "6"

# vm-pool (vendored infrastructure — these crates must never depend on
# tasks crates; app vocabulary enters only through the AppProtocol generic)
vm-pool-protocol = { path = "crates/vm-pool/protocol", version = "0.1.0-alpha.1" }
vm-pool-client = { path = "crates/vm-pool/client", version = "0.1.0-alpha.1" }
vm-pool-service = { path = "crates/vm-pool/service", version = "0.1.0-alpha.1" }
vm-pool-manager = { path = "crates/vm-pool/pool", version = "0.1.0-alpha.1" }

# tasks internal
# build-dependency only: one implementation of the version stamp, so the
# server, the client and About can be compared to each other at all.
build-stamp = { path = "crates/build-stamp" }
tasks-protocol = { path = "crates/tasks-protocol" }
tasks-api = { path = "crates/tasks-api" }
tasks = { path = "crates/tasks" }
