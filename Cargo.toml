[workspace]
resolver = "2"
members = ["crates/scout-supervisor", "crates/tasks", "crates/tasks-protocol"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/iamnbutler/tasks"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
    "macros",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
axum = "0.8"
tempfile = "3"

# vm-pool (sibling workspace)
vm-pool-protocol = { path = "../tasks-vm/crates/protocol" }
vm-pool-client = { path = "../tasks-vm/crates/client" }

# tasks internal
tasks-protocol = { path = "crates/tasks-protocol" }
