[workspace]
resolver = "2"
# app-gpui is deliberately NOT a workspace member: it drags the gpui stack
# into every `cargo test --workspace` otherwise. It builds standalone (own
# Cargo.lock) and reaches the shared wire types via a path dep on
# crates/tasks-api.
exclude = ["app-gpui"]
members = [
    "crates/build-stamp",
    "crates/builder-supervisor",
    "crates/scout-supervisor",
    "crates/tasks",
    "crates/tasks-api",
    "crates/tasks-client",
    "crates/tasks-protocol",
    "crates/vm-pool/client",
    "crates/vm-pool/pool",
    "crates/vm-pool/protocol",
    "crates/vm-pool/service",
    "crates/vm-pool/supervisor",
    "crates/vm-pool/test-support",
]

[workspace.package]
# INERT. This is not the version of anything anyone reads: the identity of a
# build is `0.1.<commit count>`, computed by `crates/build-stamp` and carried
# by every binary, the git tag, the DMG name and `GET /version` alike (#997).
# Moving this per release would buy nothing — nothing in this workspace
# publishes to crates.io, and vm-pool's separate-publishability story is its
# own and untouched — and would add a second number to keep in step.
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/iamnbutler/tasks"

[workspace.dependencies]
# One call: `kill(-pgid, sig)`, so a turn's whole process group can be swept
# (#1064). `kill_on_drop` takes the agent alone and its bash children survive
# holding the pipes we read.
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
    "macros",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    # The broker streams request and response bodies through unbuffered
    # (`wrap_stream` / `bytes_stream`) — an Anthropic SSE response must not
    # be collected before it is forwarded.
    "stream",
] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
dotenvy = "0.15"
base64 = "0.22"
# Blocking HTTP for tasks-client: the API is loopback-only plain http, so no
# TLS and no async runtime — a GUI client calls from its own worker threads.
ureq = { version = "2", default-features = false, features = ["json"] }

dirs = "6"

# Credential custody (docs/plans/2026-08-18-credential-custody.md): the sealed
# secret store is ChaCha20-Poly1305 under an HKDF-derived key, lease tokens
# are random bytes stored as SHA-256 hashes, and every raw value in memory is
# zeroized on drop. RustCrypto crates, pure Rust.
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
rand = "0.8"
# The unseal key's custody: native OS credential stores (Security.framework on
# macOS, Credential Manager on Windows, the Secret Service elsewhere) instead
# of shelling out to /usr/bin/security. The whole crate rather than
# `keyring-core` + a target-gated store, deliberately: the cheaper shape puts
# every line of `secrets.rs`'s custody path behind `#[cfg(target_os =
# "macos")]`, so Linux would never compile, lint or test the one module the
# credential design rests on. Version 4 and not 3: with no platform feature
# enabled, keyring 3 silently falls back to an in-memory *mock* store, so a
# `set_password` reports success and loses the key; keyring 4 answers
# `NoDefaultStore`, which is a sentence this module can turn into
# `TASKS_SECRETS_KEY_FILE`. `default-features = false` is not available —
# keyring 4 `compile_error!`s without `v1` or `cli`.
keyring = "4"

# vm-pool (vendored infrastructure — these crates must never depend on
# tasks crates; app vocabulary enters only through the AppProtocol generic)
vm-pool-protocol = { path = "crates/vm-pool/protocol", version = "0.1.0-alpha.1" }
vm-pool-client = { path = "crates/vm-pool/client", version = "0.1.0-alpha.1" }
vm-pool-service = { path = "crates/vm-pool/service", version = "0.1.0-alpha.1" }
vm-pool-manager = { path = "crates/vm-pool/pool", version = "0.1.0-alpha.1" }
# Dev-dependency only, and path-only on purpose: `cargo package` strips it
# from the published manifest, so it cannot affect publishability.
vm-pool-test-support = { path = "crates/vm-pool/test-support" }

# tasks internal
# build-dependency only: one implementation of the version stamp, so the
# server, the client and About can be compared to each other at all.
build-stamp = { path = "crates/build-stamp" }
tasks-protocol = { path = "crates/tasks-protocol" }
tasks-api = { path = "crates/tasks-api" }
tasks = { path = "crates/tasks" }

# Dev and test builds keep file:line backtraces and drop the rest of the
# debug info: full debuginfo doubled the target directory (6.5 GB -> 3.4 GB
# measured on a cold workspace) and cost ~12% of a cold build, and nothing
# here attaches a debugger to a dev build as a matter of course — backtraces,
# the thing the tests and `RUST_BACKTRACE=1` actually read, keep their file
# and line. It also shrinks what the linker holds in memory, which is the
# resource the SCOUT/BUILDER_BUILD_JOBS derivation exists to protect in
# memory-capped VMs. `test` inherits `dev`; `release` (what `make dist` and
# the land path ship) is untouched. Set CARGO_PROFILE_DEV_DEBUG=2 for the
# one-off session that wants a real debugger.
[profile.dev]
debug = "line-tables-only"
