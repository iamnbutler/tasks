[package]
name = "tasks-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.14.2" }
# runtime_shaders: compile Metal shaders at runtime so builds don't need the
# Xcode Metal toolchain.
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.14.2", features = ["font-kit", "runtime_shaders"] }
# Pinned to the inline-links/inline-code/soft-break markdown fixes
# (iamnbutler/gpuikit#122); move back to a crates.io version once that
# merges and releases.
gpuikit = { git = "https://github.com/iamnbutler/gpuikit", rev = "1d9aaf3dbd7fdf04886963efe9dfb847d1682afe" }
smallvec = "1"
# The server's wire types (models, events, request/response bodies) — the
# whole point of living in this repo. Path dep so type changes are atomic.
tasks-api = { path = "../crates/tasks-api" }
tasks-client = { path = "../crates/tasks-client" }
# Bridges the client's blocking streams/calls into gpui: unbounded channel
# from the SSE thread, StreamExt::next on the foreground executor.
futures = "0.3"
chrono = "0.4"
