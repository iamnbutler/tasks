[package]
name = "tasks-gpui"
version = "0.1.0"
edition = "2021"
# Spelled out rather than inherited: this crate is `exclude`d from the
# workspace (root Cargo.toml), so `license.workspace = true` is unavailable to
# it — and without these two lines it asserted *nothing*, which is the same
# defect #983 is about (a license claim with nothing behind it) with the claim
# missing too. The bundle it builds carries Apache-2.0 code as well; see
# Contents/Resources/third-party/ and README ▸ License.
license = "MIT"
repository = "https://github.com/iamnbutler/tasks"

[dependencies]
# Exact, not caret: gpuikit asks for ^1.14.2, so `=1.14.2` unifies with it,
# and a future gpuikit needing 1.15 becomes a loud resolution error here
# instead of a silent bump under an app that pins nothing else.
gpui = { package = "gpui-unofficial", version = "=1.14.2" }
# runtime_shaders: compile Metal shaders at runtime so builds don't need the
# Xcode Metal toolchain.
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.14.2", features = ["font-kit", "runtime_shaders"] }
# A git rev, and the only one in this graph — see README ▸ Dependencies.
# `Markdown::append` (which keeps a selection across a streaming delta) and the
# `stitch` feature (which closes syntax a half-streamed document leaves open)
# landed in gpuikit #134 and are in no published release; `main`'s own version
# is still 0.7.0, so there is nothing to bump to. A `rev`, never a `branch`, so
# the build stays reproducible.
#
# `editor` is on for its **syntect bridge**, not the editor widget: it is what
# `markdown::init_code_highlighting` is gated behind, and without it fenced
# code blocks render as plain monospace. It pulls syntect + onig, which is the
# one real cost — see `components/markdown.rs` for what streaming a fence
# through that highlighter measures at.
#
# The clean end state is
# `gpuikit = { version = "0.8", features = ["stitch", "editor"] }`.
gpuikit = { git = "https://github.com/iamnbutler/gpuikit", rev = "b28732f290f8bd8ca7ffcc56a40d00a852ac978a", features = ["stitch", "editor"] }
smallvec = "1"
# The server's wire types (models, events, request/response bodies) — the
# whole point of living in this repo. Path dep so type changes are atomic.
tasks-api = { path = "../crates/tasks-api" }
tasks-client = { path = "../crates/tasks-client" }
# Bridges the client's blocking streams/calls into gpui: unbounded channel
# from the SSE thread, StreamExt::next on the foreground executor.
futures = "0.3"
chrono = "0.4"
# The Agent Feed parses raw Claude Code stream-json transcript lines; every
# parse is defensive (`Value`, not typed), because the shape belongs to
# Claude Code.
serde_json = "1"
# One blocking GET on a background thread: the GitHub avatar. Default
# features (TLS) deliberately — unlike the workspace's loopback-only ureq,
# this one leaves the machine.
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar binary's status item. gpui draws the dropdown (a PopUp panel)
# but does not own NSStatusBar, so the item itself is made with the same
# bindings gpui-macos uses — pinned to the versions it pins, so nothing new
# enters the tree. Used only by `src/bin/tasks-menubar/status_item.rs`.
objc = "0.2"
cocoa = "=0.26.0"

[dev-dependencies]
# The Server menu's model reads a pidfile and drives a child process; both
# are tested against real files and a real process, per the workspace's
# no-mocks convention.
tempfile = "3"

[build-dependencies]
# The version stamp About shows, shared with the server and tasks-client so
# the three numbers are comparable at all.
build-stamp = { path = "../crates/build-stamp" }

# There is deliberately no `[profile.dev.package."*"] opt-level = 2` here, and
# gpuikit having one of its own (iamnbutler/gpuikit#140) is not a reason to add
# it: Cargo reads profiles from the root manifest of the build being run and
# ignores a dependency's, so nothing upstream can propagate one here anyway.
#
# It was measured rather than argued about. A cold build goes 182s → 644s, the
# debug binary 592 MB → 761 MB, and the edit loop does not move; the benefit is
# smoother frames, which can only be seen on a Mac and has never been measured.
# Every fresh clone — every agent VM that touches this crate — would pay the
# certain cost for the unmeasured win, so the setting is documented as a
# `.cargo/config.toml` opt-in instead, which Cargo honours identically.
#
# See README ▸ Running ▸ "Optimizing dependencies in dev builds", including how
# to measure the frame-rate side and where to record the answer (#922).
