# Publishes site/ to GitHub Pages, which serves it at nate.rip/tasks/.
#
# There is no build step — site/ is the artifact — so `site/check.sh` is the
# whole gate: it is what stops a broken link or a drifted disclaimer from
# being deployed.
#
# THE TRIGGERS ARE `push` AND `workflow_dispatch`, NEVER `pull_request`, and
# never `pull_request_target`.
#
# `push` is deliberate rather than incidental: a Builder branch is pushed into
# this repository, so a push-triggered workflow attaches its check runs to the
# commit a pull request points at, which is exactly how `.github/workflows/
# ci.yml` became the merge brief's evidence in #1015. This one is filtered to
# `site/**`, so on most branches it simply does not run — an absent check is
# not a passing one, and `Landing` reads `mergeable_state`, which only ever
# reports the checks that exist.
#
# `pull_request_target` is refused outright and permanently: it would run fork
# code with this repository's secrets and its `GITHUB_TOKEN` write scope.
# `no_workflow_runs_fork_code_with_our_secrets` in `crates/tasks/tests/site.rs`
# fails the suite if any workflow here grows one.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The disclaimer on the page is a copy of the README's and `check.sh`
      # compares them, so a README edit can break this deploy.
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: the previous page keeps serving until a
# new one lands, and a half-replaced site is the one state worse than a stale
# one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `bash site/check.sh`, not `./site/check.sh` — the executable bit is
      # not something to depend on surviving a checkout.
      - name: Check the site
        run: bash site/check.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
