# fmt, clippy and the whole suite, on every push (#1015).
#
# THE PUSH TRIGGER CARRIES NO `branches:` AND NO `paths:` FILTER, DELIBERATELY.
#
# This pipeline pushes Builder branches into this repository and merges its own
# pull requests, and as of #1015 the merge brief cites GitHub's verdict on the
# head commit as evidence. A filter that skipped a branch — or a path — would
# leave a pull request reading `clean` because nothing ran, which is the one
# way `clean` can lie. `ci_runs_the_suite_on_every_push` in
# `crates/tasks/tests/site.rs` fails the suite if either filter appears here.
#
# These checks are NOT required: there is no branch protection on this
# repository, so GitHub will still take a merge over a red check. What they
# changed is what `mergeable_state` can say — `unstable` is now reachable and
# means a check failed *or* has not finished, which GitHub does not
# distinguish. Making them required changes who can land and is a separate
# decision, taken deliberately, later.
#
# `pull_request` is not here because `push` already covers every branch in this
# repository and would double every run. `pull_request_target` must never be
# here at all: it runs fork code with this repository's secrets.
#
# `make site-check` is deliberately NOT a step. It fails today for a reason no
# agent can fix — the three screenshots need a Mac — so it would paint every
# commit red and train the verdict out of use, which is the whole value here.
# Its disclaimer-drift half is a workspace test and so already runs under `make
# test-ci`; the link half is pages.yml's own gate, where a failure holds the
# deploy and leaves the previous page serving.
#
# THREE JOBS, NOT ONE, so the wall clock is the slowest of them rather than
# the sum — the suite and app-gpui's cold build are each minutes, and neither
# needs the other's artifacts. The split changes nothing about the evidence:
# `mergeable_state` aggregates every check on the commit, so one red job reads
# exactly as the one red step did; it just arrives sooner. Each job restores
# only the cache it uses (rust-cache keys per job by default, which is wanted:
# clippy's check artifacts and the suite's test builds are different sets, and
# a shared key would have each run restoring the other's), and this repository
# is public, so parallel runners cost nothing.
name: CI

on:
  push:
  workflow_dispatch:

# One run per ref. A superseded push has nothing to say — but see pages.yml,
# where cancelling is the wrong call because a half-replaced site is worse than
# a stale one. Nothing is published here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1, in EVERY job. `build-stamp`
      # derives every binary's identity from `git rev-list --count HEAD`, so a
      # shallow clone stamps this build `0.1.1` — a number that collides with
      # a real early build and makes every `ImageFreshness` comparison
      # meaningless. The first CI run found it, by failing three `UpdateWatch`
      # tests that asserted `0.1.1` was stale. Only the suite asserts on the
      # number today, but the stamp compiles into everything (clippy builds
      # build.rs too), so the depth is uniform rather than rediscovered
      # per job the next time a test reads it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

  suite:
    name: suite
    runs-on: ubuntu-latest
    steps:
      # Full history for the build stamp — the comment on `lint`'s checkout is
      # the reason, and this is the job whose tests assert on the number.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      # `make test-ci`, not `cargo nextest` by hand: it prebuilds the
      # supervisor binaries and exports TASKS_TEST_BIN_DIR (tests exec binaries
      # and must never build them), runs the `ci` profile — no fail-fast,
      # retries, a quieter slow threshold — and then runs the doctests, which
      # nextest skips silently and with no count in its summary.
      - run: make test-ci

  app:
    name: app-gpui
    runs-on: ubuntu-latest
    steps:
      # Full history for the build stamp — the comment on `lint`'s checkout is
      # the reason; app-gpui stamps its About window from the same crate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # app-gpui is deliberately not a workspace member and has its own target
      # directory; this job caches only that one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-gpui -> app-gpui/target

      # app-gpui's five. The Makefile falls back to stub `.so`s where these are
      # absent, and that fallback exists for hosts that cannot install
      # packages — exercising it here would test the stubs rather than the app.
      # `images/{scout,builder}/Dockerfile` install the same five.
      - name: Install app-gpui's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      # Compile and test the app. Neither needs a display or a Mac; what they
      # cannot say is that a pixel landed anywhere, which stays `make app` on a
      # Mac.
      - run: make app-check
      - run: make app-test
