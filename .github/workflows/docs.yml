name: Deploy Spec Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'spec/**'
      - 'docs/book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      bump_version:
        description: 'Bump spec version (patch/minor/major)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Get current version
        id: version
        run: |
          if [ -f spec/VERSION ]; then
            VERSION=$(cat spec/VERSION)
          else
            VERSION="0.1.0"
            echo "$VERSION" > spec/VERSION
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Bump version (if requested)
        if: github.event.inputs.bump_version != ''
        run: |
          VERSION=$(cat spec/VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ github.event.inputs.bump_version }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > spec/VERSION
          echo "Bumped version from $VERSION to $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spec/VERSION
          git commit -m "Bump spec version to $NEW_VERSION"
          git push

      - name: Install mdBook
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build documentation
        working-directory: docs
        run: |
          mdbook build

      - name: Download existing gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          mkdir -p gh-pages-content
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages -- . 2>/dev/null || true
            # Move existing content to temp location
            if [ -d "versions" ]; then
              mv versions gh-pages-content/
            fi
            if [ -f "versions.json" ]; then
              mv versions.json gh-pages-content/
            fi
            git checkout - -- . 2>/dev/null || true
          fi

      - name: Setup versioned output
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p site/versions/$VERSION

          # Copy built docs to versioned directory
          cp -r docs/build/* site/versions/$VERSION/

          # Copy built docs to latest
          mkdir -p site/latest
          cp -r docs/build/* site/latest/

          # Restore existing versions
          if [ -d "gh-pages-content/versions" ]; then
            for dir in gh-pages-content/versions/*/; do
              if [ -d "$dir" ]; then
                existing_version=$(basename "$dir")
                if [ "$existing_version" != "$VERSION" ]; then
                  cp -r "$dir" "site/versions/"
                fi
              fi
            done
          fi

          # Update or create versions.json
          if [ -f "gh-pages-content/versions.json" ]; then
            # Check if current version exists, if not add it
            if ! jq -e ".versions[] | select(.version == \"$VERSION\")" gh-pages-content/versions.json > /dev/null 2>&1; then
              jq --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '.versions = [{"version": $v, "date": $d}] + .versions | .latest = $v' \
                gh-pages-content/versions.json > site/versions.json
            else
              # Update latest pointer
              jq --arg v "$VERSION" '.latest = $v' gh-pages-content/versions.json > site/versions.json
            fi
          else
            # Create new versions.json
            echo "{\"latest\": \"$VERSION\", \"versions\": [{\"version\": \"$VERSION\", \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" | jq . > site/versions.json
          fi

          cat site/versions.json

      - name: Create index page with version selector
        run: |
          cat > site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tasks Specification</title>
            <style>
              :root {
                --bg-primary: #ffffff;
                --bg-secondary: #f8f9fa;
                --text-primary: #1a1a2e;
                --text-secondary: #4a4a6a;
                --accent: #3b82f6;
                --accent-hover: #2563eb;
                --border: #e2e8f0;
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  --bg-primary: #0f172a;
                  --bg-secondary: #1e293b;
                  --text-primary: #f1f5f9;
                  --text-secondary: #94a3b8;
                  --accent: #60a5fa;
                  --accent-hover: #93c5fd;
                  --border: #334155;
                }
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: var(--bg-primary);
                color: var(--text-primary);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
              }
              .container {
                max-width: 600px;
                width: 100%;
                text-align: center;
              }
              h1 {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
                font-weight: 700;
              }
              .subtitle {
                color: var(--text-secondary);
                margin-bottom: 2rem;
                font-size: 1.1rem;
              }
              .latest-btn {
                display: inline-block;
                background: var(--accent);
                color: white;
                padding: 1rem 2rem;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 600;
                font-size: 1.1rem;
                margin-bottom: 2rem;
                transition: background 0.2s;
              }
              .latest-btn:hover {
                background: var(--accent-hover);
              }
              .versions-section {
                background: var(--bg-secondary);
                border-radius: 12px;
                padding: 1.5rem;
                border: 1px solid var(--border);
              }
              .versions-title {
                font-size: 0.875rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-secondary);
                margin-bottom: 1rem;
              }
              .versions-list {
                list-style: none;
              }
              .versions-list li {
                padding: 0.75rem;
                border-bottom: 1px solid var(--border);
              }
              .versions-list li:last-child {
                border-bottom: none;
              }
              .versions-list a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
              }
              .versions-list a:hover {
                text-decoration: underline;
              }
              .version-date {
                color: var(--text-secondary);
                font-size: 0.875rem;
                margin-left: 0.5rem;
              }
              .loading {
                color: var(--text-secondary);
                padding: 1rem;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Tasks Specification</h1>
              <p class="subtitle">Human-in-the-loop platform for orchestrating coding agents</p>
              <a href="./latest/" class="latest-btn" id="latest-btn">View Latest Documentation</a>
              <div class="versions-section">
                <h2 class="versions-title">All Versions</h2>
                <ul class="versions-list" id="versions-list">
                  <li class="loading">Loading versions...</li>
                </ul>
              </div>
            </div>
            <script>
              fetch('./versions.json')
                .then(r => r.json())
                .then(data => {
                  const list = document.getElementById('versions-list');
                  list.innerHTML = data.versions.map(v => {
                    const date = new Date(v.date).toLocaleDateString('en-US', {
                      year: 'numeric', month: 'short', day: 'numeric'
                    });
                    const isLatest = v.version === data.latest ? ' (latest)' : '';
                    return `<li><a href="./versions/${v.version}/">v${v.version}${isLatest}</a><span class="version-date">${date}</span></li>`;
                  }).join('');
                })
                .catch(() => {
                  document.getElementById('versions-list').innerHTML = '<li>Unable to load versions</li>';
                });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
