serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
sqlx.workspace = true
reqwest.workspace = true
vm-pool-protocol.workspace = true
vm-pool-client.workspace = true
vm-pool-service.workspace = true
vm-pool-manager.workspace = true
tasks-protocol.workspace = true
tasks-api.workspace = true
base64.workspace = true
dotenvy.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
zeroize.workspace = true
rand.workspace = true

[build-dependencies]
build-stamp.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `full` deliberately excludes `test-util`, so the paused clock the brief's
# shared-budget test asserts on has to be asked for here.
tokio = { workspace = true, features = ["test-util"] }
