[package]
name = "tasks-api"
description = "Wire types for the tasks HTTP API — shared by the server and native clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
# Decision evidence is free-form JSON by design — what a decider checked is
# not a fixed shape, and typing it would be guessing. `Value` is the honest
# type for that, and any HTTP client of these types already links serde_json.
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
